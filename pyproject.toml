[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-sonex"
version = "0.1.0"
description = "LiveKit Agents plugin for SonexLabs TTS"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SonexLabs", email = "hi@sonexlabs.com" }]
keywords = ["audio", "livekit", "realtime", "sonexlabs", "tts", "webrtc"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10.0"
dependencies = [
    "livekit-agents>=1.6.7",
    "aiohttp>=3.9.0",
]

[project.urls]
Documentation = "https://docs.sonexlabs.com"
Website = "https://www.sonexlabs.com"
Source = "https://github.com/sonexlabs/livekit-plugins-sonex"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]